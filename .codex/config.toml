profile = "humanlayer-local"

[profiles.humanlayer-local]
model = "gpt-5.5"
approval_policy = "never"
sandbox_mode = "workspace-write"
web_search = "live"

[sandbox_workspace_write]
network_access = false

# Keep only explicitly designated MCP servers active in this project.
[mcp_servers.deepwiki]
url = "https://mcp.deepwiki.com/mcp"
enabled = true
required = false
tool_timeout_sec = 60

[mcp_servers.context7]
enabled = false

[mcp_servers.linearis]
enabled = false

[shell_environment_policy]
inherit = "core"

[shell_environment_policy.set]
MAX_THINKING_TOKENS = "32000"
